[project]
name = "netmon"
version = "0.1.0"
description = "Platform monitoring jaringan multi-vendor (Mikrotik, Cisco, Ruijie, dan vendor lainnya)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "celery>=5.6.3",
    "redis>=8.0.1",
    "alembic>=1.18.5",
    "cryptography>=49.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "anyio>=4.7.0",
    "httpx>=0.28.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
